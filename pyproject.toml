[project]
name = "attendbot"
version = "0.2.0"
description = "Telegram-controlled bot that marks attendance on the KBTU portal during scheduled windows"
readme = "README.md"
requires-python = ">=3.12"
# Direct dependencies only; transitive versions are pinned in uv.lock.
dependencies = [
    "pyTelegramBotAPI>=4.36.1,<5",
    "python-dotenv>=1.2.2,<2",
    "selenium>=4.30,<5",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
